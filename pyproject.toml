[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unlearning-at-scale"
version = "0.2.0"
description = "Experimental artifact for deterministic training replay and LLM data deletion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "torch>=2.2"]

[project.optional-dependencies]
llm = ["transformers>=4.52", "datasets>=3.0", "peft>=0.15", "accelerate>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
uas = "unlearning_at_scale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
