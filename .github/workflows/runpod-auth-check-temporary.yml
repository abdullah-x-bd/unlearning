name: Temporary RunPod integration check

on:
  push:
    branches: [runpod-first-gpu]
    paths:
      - gpu/trigger-runpod-auth-check-v1

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-24.04
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runpod-first-gpu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run regression tests
        run: pytest -q
      - name: Run exact replay smoke test
        run: python -m unlearning_at_scale.cli core-smoke --output runs/runpod-integration-smoke
      - name: Verify RunPod secret and read-only API access
        run: |
          test -n "$RUNPOD_API_KEY"
          python scripts/runpod_control.py auth-check
      - name: Persist integration success marker
        run: |
          mkdir -p gpu
          printf 'Offline tests, replay smoke test, and RunPod API authentication all passed in GitHub Actions.\n' > gpu/runpod-integration-check-passed-v1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/runpod-integration-check-passed-v1
          git commit -m 'Record successful RunPod integration gate'
          git push origin HEAD:runpod-first-gpu
