name: Temporary TOFU full-run status

on:
  push:
    branches: [main]
    paths:
      - gpu/trigger-tofu-full-status-v1

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read latest TOFU full runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/runpod-tofu-llama1b-full.yml/runs?per_page=5"
          )
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          rows = []
          for run in payload.get('workflow_runs', []):
              rows.append({
                  'id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'event': run.get('event'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              })
          Path('gpu/tofu-llama1b-full-status.json').write_text(
              json.dumps({'runs': rows}, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Persist sanitized status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/tofu-llama1b-full-status.json
          git commit -m 'Record TOFU Llama 1B full status' || exit 0
          git push origin HEAD:main
