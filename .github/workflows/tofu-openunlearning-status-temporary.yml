name: Temporary TOFU OpenUnlearning status

on:
  push:
    branches: [main]
    paths:
      - gpu/trigger-tofu-openunlearning-status-v1

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read current Actions and RunPod status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/runpod-tofu-openunlearning-eval.yml/runs?per_page=5',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              actions = json.load(response)
          runs = []
          for run in actions.get('workflow_runs', []):
              runs.append({
                  'id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'event': run.get('event'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              })

          pods_req = urllib.request.Request(
              'https://rest.runpod.io/v1/pods',
              headers={'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}"},
          )
          with urllib.request.urlopen(pods_req, timeout=30) as response:
              pods_raw = json.load(response)
          pods = []
          for pod in pods_raw:
              if not str(pod.get('name', '')).startswith('uas-tofu-ou-eval-'):
                  continue
              gpu = pod.get('gpu') or {}
              machine = pod.get('machine') or {}
              pods.append({
                  'id': pod.get('id'),
                  'name': pod.get('name'),
                  'desiredStatus': pod.get('desiredStatus'),
                  'costPerHr': pod.get('adjustedCostPerHr') or pod.get('costPerHr'),
                  'gpu': gpu.get('displayName') or machine.get('gpuDisplayName') or machine.get('gpuTypeId'),
                  'createdAt': pod.get('createdAt'),
              })
          Path('gpu/tofu-openunlearning-status.json').write_text(
              json.dumps({'runs': runs, 'pods': pods}, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Persist sanitized status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/tofu-openunlearning-status.json
          git commit -m 'Record TOFU OpenUnlearning status' || exit 0
          git push origin HEAD:main
