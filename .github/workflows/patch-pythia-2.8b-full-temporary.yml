name: Temporary patch Pythia 2.8B full workflow

on:
  push:
    branches: [main]
    paths:
      - gpu/trigger-patch-pythia-2.8b-full-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add PyYAML bootstrap to pre-allocation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/runpod-pythia-2.8b-full.yml')
          text = path.read_text()
          old = """      - name: Verify frozen four-pass release configuration
        run: |
          python - <<'PY'
"""
          new = """      - name: Verify frozen four-pass release configuration
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2
          python - <<'PY'
"""
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one release-config verification block')
          path.write_text(text.replace(old, new))
          PY
      - name: Persist patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/runpod-pythia-2.8b-full.yml
          git commit -m 'Bootstrap PyYAML before full-run config guard'
          git push origin HEAD:main
