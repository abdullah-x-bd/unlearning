name: RunPod TOFU OpenUnlearning evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gpu/trigger-tofu-openunlearning-eval-v1

permissions:
  contents: read

concurrency:
  group: runpod-tofu-openunlearning-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_ALT: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      MAX_HOURLY_COST: "0.70"
      POD_SELF_DESTRUCT_SECONDS: "14400"
      MIN_FREE_GPU_MIB: "45000"
      MAX_GPU_ALLOCATION_ATTEMPTS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zero-cost credential, artifact, and evaluator preflight
        run: |
          set -Eeuo pipefail
          test -n "$RUNPOD_API_KEY"
          python -m pip install --disable-pip-version-check --quiet \
            huggingface_hub==0.36.0 \
            pyyaml==6.0.2
          python scripts/runpod_control.py auth-check
          python scripts/preflight_tofu_openunlearning.py
          python - <<'PY'
          import accelerate
          import huggingface_hub
          import lm_eval
          import peft
          import torch
          import transformers
          from lm_eval.models.hf_vlms import HFLM
          assert torch.__version__.startswith('2.4.1')
          assert transformers.__version__ == '4.51.3'
          assert accelerate.__version__ == '0.34.2'
          assert huggingface_hub.__version__ == '0.36.0'
          print(
              'zero-cost evaluator import gate passed; '
              f'torch={torch.__version__}; transformers={transformers.__version__}; '
              f'HFLM={HFLM.__name__}'
          )
          PY

      - name: Generate ephemeral SSH key and token file
        run: |
          mkdir -p .runpod
          ssh-keygen -t ed25519 -N '' -f .runpod/id_ed25519
          TOKEN="${HF_TOKEN_PRIMARY:-$HF_TOKEN_ALT}"
          test -n "$TOKEN"
          umask 077
          printf '%s' "$TOKEN" > .runpod/hf_token

      - name: Allocate one clean guarded RTX A6000 Pod
        id: pod
        run: |
          set -Eeuo pipefail
          accepted=0
          for attempt in $(seq 1 "$MAX_GPU_ALLOCATION_ATTEMPTS"); do
            echo "A6000 allocation attempt ${attempt}/${MAX_GPU_ALLOCATION_ATTEMPTS}"
            rm -f runpod-allocation.json
            python scripts/runpod_control.py create \
              --name "uas-tofu-ou-eval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a${attempt}" \
              --public-key-file .runpod/id_ed25519.pub \
              --gpu-types "NVIDIA RTX A6000" \
              --max-hourly-cost "$MAX_HOURLY_COST" \
              --wait-seconds 900 \
              --output runpod-allocation.json

            readarray -t allocation < <(python - <<'PY'
          import json
          payload = json.load(open('runpod-allocation.json'))
          print(payload['pod_id'])
          print(payload['host'])
          print(payload['port'])
          PY
            )
            pod_id="${allocation[0]}"
            host="${allocation[1]}"
            port="${allocation[2]}"

            ssh_ready=0
            for ssh_attempt in $(seq 1 90); do
              if ssh \
                -i .runpod/id_ed25519 \
                -p "$port" \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 \
                "root@$host" 'echo ssh-ready'; then
                ssh_ready=1
                break
              fi
              sleep 5
            done

            if [[ "$ssh_ready" != "1" ]]; then
              echo "Rejecting Pod $pod_id because SSH never became ready" >&2
              python scripts/runpod_control.py delete --pod-id "$pod_id" || true
              sleep 3
              continue
            fi

            clean_log=".runpod/gpu-cleanliness-attempt-${attempt}.txt"
            if ssh \
              -i .runpod/id_ed25519 \
              -p "$port" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              "root@$host" \
              "MIN_FREE_GPU_MIB='$MIN_FREE_GPU_MIB' bash -s" <<'REMOTE' | tee "$clean_log"
          set -Eeuo pipefail
          gpu_line="$(nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits | head -n 1)"
          gpu_name="$(printf '%s\n' "$gpu_line" | awk -F, '{gsub(/^ +| +$/, "", $1); print $1}')"
          total_mib="$(printf '%s\n' "$gpu_line" | awk -F, '{gsub(/ /, "", $2); print $2}')"
          free_mib="$(printf '%s\n' "$gpu_line" | awk -F, '{gsub(/ /, "", $3); print $3}')"
          compute_apps="$(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader,nounits 2>/dev/null | sed '/^[[:space:]]*$/d' || true)"
          echo "gpu_name=$gpu_name"
          echo "total_mib=$total_mib"
          echo "free_mib=$free_mib"
          echo "minimum_free_mib=$MIN_FREE_GPU_MIB"
          if [[ -n "$compute_apps" ]]; then
            echo "foreign_compute_processes_present=true"
            printf '%s\n' "$compute_apps"
            exit 42
          fi
          echo "foreign_compute_processes_present=false"
          if (( free_mib < MIN_FREE_GPU_MIB )); then
            echo "GPU rejected: only ${free_mib} MiB free" >&2
            exit 43
          fi
          if [[ "$gpu_name" != "NVIDIA RTX A6000" ]]; then
            echo "GPU rejected: unexpected device $gpu_name" >&2
            exit 44
          fi
          echo "clean_gpu_gate=passed"
          REMOTE
            then
              cp "$clean_log" .runpod/gpu-cleanliness-accepted.txt
              echo "Accepted clean A6000 Pod $pod_id"
              echo "allocated_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
              accepted=1
              break
            fi

            echo "Rejecting contaminated A6000 Pod $pod_id before model load" >&2
            python scripts/runpod_control.py delete --pod-id "$pod_id" || true
            sleep 3
          done

          if [[ "$accepted" != "1" ]]; then
            echo "Could not obtain a clean RTX A6000 after ${MAX_GPU_ALLOCATION_ATTEMPTS} attempts" >&2
            exit 1
          fi

      - name: Wait for SSH daemon
        run: |
          for attempt in $(seq 1 30); do
            if ssh \
              -i .runpod/id_ed25519 \
              -p "${{ steps.pod.outputs.port }}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              "root@${{ steps.pod.outputs.host }}" 'echo ssh-ready'; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH was lost after clean-GPU acceptance" >&2
          exit 1

      - name: Reconstruct canonical states and run pinned OpenUnlearning evaluation
        id: remote
        continue-on-error: true
        run: |
          scp \
            -i .runpod/id_ed25519 \
            -P "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            runpod-allocation.json .runpod/hf_token \
            "root@${{ steps.pod.outputs.host }}:/workspace/"

          ssh \
            -i .runpod/id_ed25519 \
            -p "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@${{ steps.pod.outputs.host }}" \
            "REPO_SHA='${GITHUB_SHA}' SELF_DESTRUCT='${POD_SELF_DESTRUCT_SECONDS}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          nohup bash -lc "sleep ${SELF_DESTRUCT}; runpodctl pod delete \$RUNPOD_POD_ID" \
            >/tmp/uas-self-destruct.log 2>&1 &

          cd /workspace
          rm -rf unlearning
          git clone https://github.com/abdullah-x-bd/unlearning.git unlearning
          cd unlearning
          git checkout --detach "$REPO_SHA"
          export HF_TOKEN="$(cat /workspace/hf_token)"
          rm -f /workspace/hf_token
          export HF_HUB_DISABLE_TELEMETRY=1
          export TOKENIZERS_PARALLELISM=false
          export PYTHONHASHSEED=2026
          export CUBLAS_WORKSPACE_CONFIG=:4096:8
          export WANDB_MODE=disabled

          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e '.[llm,dev]'
          mkdir -p results
          cp /workspace/runpod-allocation.json results/runpod-allocation.json
          RECONSTRUCTION_MINUTES=90 \
          FIRST_EVAL_MINUTES=75 \
          SECOND_EVAL_MINUTES=45 \
            bash scripts/run_tofu_openunlearning_eval.sh
          REMOTE

      - name: Collect compact reconstruction and evaluation evidence
        if: always() && steps.pod.outputs.pod_id != ''
        continue-on-error: true
        run: |
          mkdir -p gpu-artifacts
          cp runpod-allocation.json gpu-artifacts/
          cp .runpod/gpu-cleanliness-accepted.txt gpu-artifacts/ || true
          for file in tofu-openunlearning-evidence.tar.gz tofu-openunlearning-evidence.sha256; do
            scp \
              -i .runpod/id_ed25519 \
              -P "${{ steps.pod.outputs.port }}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=2 \
              "root@${{ steps.pod.outputs.host }}:/workspace/unlearning/results/$file" \
              "gpu-artifacts/$file" || true
          done

      - name: Preserve hash-verified checkpoints after evaluator failure
        if: always() && steps.remote.outcome != 'success' && steps.pod.outputs.pod_id != ''
        continue-on-error: true
        run: |
          mkdir -p recovery-checkpoints
          ssh \
            -i .runpod/id_ed25519 \
            -p "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@${{ steps.pod.outputs.host }}" \
            'cd /workspace/unlearning && \
             python -c "import json; s=json.load(open(\"runs/tofu-openunlearning-reconstruction/summary.json\")); assert s.get(\"status\")==\"passed\"" && \
             tar -cf /workspace/tofu-openunlearning-recovery.tar \
               runs/tofu-openunlearning-reconstruction/hf/original \
               runs/tofu-openunlearning-reconstruction/hf/deletion \
               runs/tofu-openunlearning-reconstruction/summary.json'
          scp \
            -i .runpod/id_ed25519 \
            -P "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            "root@${{ steps.pod.outputs.host }}:/workspace/tofu-openunlearning-recovery.tar" \
            recovery-checkpoints/tofu-openunlearning-recovery.tar || true

      - name: Upload temporary recovery checkpoints
        if: always() && steps.remote.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tofu-openunlearning-recovery-checkpoints
          path: recovery-checkpoints/tofu-openunlearning-recovery.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Terminate RunPod Pod
        if: always() && steps.pod.outputs.pod_id != ''
        run: |
          python scripts/runpod_control.py delete --pod-id "${{ steps.pod.outputs.pod_id }}"

      - name: Record bounded cost estimate
        if: always() && steps.pod.outputs.pod_id != ''
        run: |
          mkdir -p gpu-artifacts
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          allocation = json.loads(Path('runpod-allocation.json').read_text())
          elapsed = max(0, time.time() - int("${{ steps.pod.outputs.allocated_epoch }}"))
          hourly = float(allocation['cost_per_hr'])
          self_destruct = int(os.environ['POD_SELF_DESTRUCT_SECONDS'])
          payload = {
              'elapsed_seconds_until_cleanup': elapsed,
              'reported_hourly_gpu_cost': hourly,
              'estimated_gpu_cost_until_cleanup': hourly * elapsed / 3600.0,
              'hard_hourly_cap': float(os.environ['MAX_HOURLY_COST']),
              'pod_self_destruct_seconds': self_destruct,
              'maximum_gpu_cost_at_both_caps': float(os.environ['MAX_HOURLY_COST']) * self_destruct / 3600.0,
              'training_passes': 2,
              'benchmark': 'OpenUnlearning TOFU forget10',
              'attention_implementation': 'eager',
              'minimum_free_gpu_mib_at_acceptance': int(os.environ['MIN_FREE_GPU_MIB']),
          }
          Path('gpu-artifacts/cost-estimate.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload OpenUnlearning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-openunlearning-evidence
          path: gpu-artifacts
          if-no-files-found: warn
          retention-days: 60
          compression-level: 0

      - name: Enforce evaluation success
        if: always()
        run: |
          if [[ "${{ steps.remote.outcome }}" != "success" ]]; then
            echo "The remote TOFU reconstruction/OpenUnlearning evaluation did not complete successfully." >&2
            exit 1
          fi
          test -f gpu-artifacts/tofu-openunlearning-evidence.tar.gz
          test -f gpu-artifacts/tofu-openunlearning-evidence.sha256
