name: RunPod TOFU OpenUnlearning evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gpu/trigger-tofu-openunlearning-eval-v1

permissions:
  contents: read

concurrency:
  group: runpod-tofu-openunlearning-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_ALT: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      MAX_HOURLY_COST: "0.70"
      MAX_RUNTIME_MINUTES: "240"
      FROZEN_RELEASE_DIR: results/releases/tofu-llama32-1b-forget10-2026-08-11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify credentials, frozen hashes, and Hub access before allocating compute
        run: |
          set -Eeuo pipefail
          test -n "$RUNPOD_API_KEY"
          python -m pip install --disable-pip-version-check --quiet \
            huggingface_hub==0.36.0 \
            pyyaml==6.0.2
          python scripts/runpod_control.py auth-check
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          release = Path(os.environ['FROZEN_RELEASE_DIR'])
          frozen = json.loads((release / 'frozen-hashes.json').read_text())
          expected = {
              'source_workflow_run': 31490644488,
              'model_revision': '9213176726f574b556790deb65791e0c5aa438b6',
              'plan_sha256': '466595193cba55c4cf408b5d5c7d679d6d93bcd73dc11a8b356ac2c716c282da',
              'forget_ids_sha256': 'dc1f259e1c930087b81fc2c82ac38345a6ff1097760137bbb366a4f62230dc3d',
              'original_model_sha256': '54c711e9bde77215d9c5def50429f925a382bdcd28150bb87a89a118dd54bc65',
              'original_optimizer_sha256': '7dae55302988b834099f224a6ababcbd97a3411afa1b54e5e9a1739854f8e773',
              'deletion_model_sha256': '067109bfd2e34f1616a8069d04ecd28b4814513332b03957ab917503122aeec3',
              'deletion_optimizer_sha256': '0152484534eab198ebee5a500e77d81451f2cba34ea6baa987ccc5726e20daa1',
          }
          for key, value in expected.items():
              if frozen.get(key) != value:
                  raise RuntimeError(f'frozen release mismatch for {key}: {frozen.get(key)} != {value}')

          token = (os.environ.get('HF_TOKEN_PRIMARY') or os.environ.get('HF_TOKEN_ALT') or '').strip()
          if not token:
              raise RuntimeError('HF_TOKEN is missing; refusing to allocate paid GPU compute')

          lock = json.loads(Path('locks/artifacts.lock.json').read_text())
          llama = lock['huggingface']['llama32_1b_instruct']
          if llama['resolved_sha'] != frozen['model_revision']:
              raise RuntimeError('artifact lock and frozen TOFU release disagree on Llama revision')
          hf_hub_download(
              repo_id=llama['repo_id'],
              filename='config.json',
              revision=llama['resolved_sha'],
              token=token,
          )
          hf_hub_download(
              repo_id='open-unlearning/tofu_Llama-3.2-1B-Instruct_retain90',
              filename='config.json',
              revision='7114300c0049527a71833f5683965c358ad9dcbf',
              token=token,
          )
          print('Frozen TOFU hashes and model access verified before allocation')
          PY

      - name: Zero-cost pinned OpenUnlearning command preflight
        run: |
          set -Eeuo pipefail
          python scripts/bootstrap_upstreams.py
          test "$(git -C external/open-unlearning rev-parse HEAD)" = "4ad738aaf60f6a4385f6e2506d01da99e76c31f3"
          python scripts/openunlearning_adapter.py tofu-eval \
            --checkpoint /tmp/uas-placeholder-original \
            --forget-split forget10 \
            --task-name uas_preflight_original \
            --attention-implementation eager \
            --output-root /tmp/uas-openunlearning-preflight \
            --dry-run
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          paths = [
              'scripts/reconstruct_tofu_for_openunlearning.py',
              'scripts/openunlearning_adapter.py',
          ]
          for path in paths:
              spec = importlib.util.spec_from_file_location('preflight_module', path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f'could not import-check {path}')
              compile(Path(path).read_text(), path, 'exec')
          print('Reconstruction and adapter syntax preflight passed')
          PY

      - name: Generate ephemeral SSH key and token file
        run: |
          mkdir -p .runpod
          ssh-keygen -t ed25519 -N '' -f .runpod/id_ed25519
          TOKEN="${HF_TOKEN_PRIMARY:-$HF_TOKEN_ALT}"
          test -n "$TOKEN"
          umask 077
          printf '%s' "$TOKEN" > .runpod/hf_token

      - name: Allocate one guarded RTX A6000 Pod
        id: pod
        run: |
          python scripts/runpod_control.py create \
            --name "uas-tofu-ou-eval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --public-key-file .runpod/id_ed25519.pub \
            --gpu-types "NVIDIA RTX A6000" \
            --max-hourly-cost "$MAX_HOURLY_COST" \
            --wait-seconds 900 \
            --output runpod-allocation.json
          echo "allocated_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH daemon
        run: |
          for attempt in $(seq 1 90); do
            if ssh \
              -i .runpod/id_ed25519 \
              -p "${{ steps.pod.outputs.port }}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              "root@${{ steps.pod.outputs.host }}" 'echo ssh-ready'; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH did not become ready" >&2
          exit 1

      - name: Reconstruct canonical states and run pinned OpenUnlearning evaluation
        id: remote
        continue-on-error: true
        run: |
          scp \
            -i .runpod/id_ed25519 \
            -P "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            runpod-allocation.json .runpod/hf_token \
            "root@${{ steps.pod.outputs.host }}:/workspace/"

          ssh \
            -i .runpod/id_ed25519 \
            -p "${{ steps.pod.outputs.port }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@${{ steps.pod.outputs.host }}" \
            "REPO_SHA='${GITHUB_SHA}' MAX_RUNTIME_MINUTES='${MAX_RUNTIME_MINUTES}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          nohup bash -lc 'sleep 16200; runpodctl pod delete "$RUNPOD_POD_ID"' >/tmp/uas-self-destruct.log 2>&1 &

          cd /workspace
          rm -rf unlearning
          git clone https://github.com/abdullah-x-bd/unlearning.git unlearning
          cd unlearning
          git checkout --detach "$REPO_SHA"
          export HF_TOKEN="$(cat /workspace/hf_token)"
          rm -f /workspace/hf_token
          export HF_HUB_DISABLE_TELEMETRY=1
          export TOKENIZERS_PARALLELISM=false
          export PYTHONHASHSEED=2026
          export CUBLAS_WORKSPACE_CONFIG=:4096:8
          export WANDB_MODE=disabled

          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e '.[llm,dev]'
          mkdir -p results
          cp /workspace/runpod-allocation.json results/runpod-allocation.json
          exec > >(tee -a results/tofu-openunlearning-eval.log) 2>&1

          package_evidence() {
            set +e
            df -h > results/tofu-openunlearning-disk-after.txt 2>&1
            python - <<'PY'
          from pathlib import Path
          import hashlib
          import tarfile

          output = Path('results/tofu-openunlearning-evidence.tar.gz')
          roots = [
              Path('results/openunlearning/tofu'),
              Path('runs/tofu-openunlearning-reconstruction'),
          ]
          singles = [
              Path('results/runpod-allocation.json'),
              Path('results/tofu-openunlearning-eval.log'),
              Path('results/tofu-openunlearning-gpu-probe.json'),
              Path('results/tofu-openunlearning-disk-before.txt'),
              Path('results/tofu-openunlearning-disk-after.txt'),
              Path('results/releases/tofu-llama32-1b-forget10-2026-08-11/frozen-hashes.json'),
          ]
          excluded_suffixes = {'.pt', '.pth', '.bin', '.npy', '.npz', '.safetensors'}
          excluded_parts = {'redacted-data'}
          with tarfile.open(output, 'w:gz') as archive:
              for root in roots:
                  if not root.exists():
                      continue
                  for path in sorted(root.rglob('*')):
                      if not path.is_file():
                          continue
                      if path.suffix in excluded_suffixes:
                          continue
                      if any(part in excluded_parts for part in path.parts):
                          continue
                      archive.add(path, arcname=str(path))
              for path in singles:
                  if path.exists():
                      archive.add(path, arcname=str(path))
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('results/tofu-openunlearning-evidence.sha256').write_text(
              f'{digest}  {output.name}\n'
          )
          print(f'OpenUnlearning evidence TAR SHA256: {digest}', flush=True)
          PY
          }
          trap package_evidence EXIT

          df -h > results/tofu-openunlearning-disk-before.txt
          python scripts/gpu_probe.py --output results/tofu-openunlearning-gpu-probe.json
          python scripts/bootstrap_upstreams.py
          python scripts/prepare_release_data.py --clean --wikitext-max-records 20000
          python scripts/validate_release_data.py
          python scripts/verify_release_lock.py

          python scripts/gpu_phase_release_smoke.py \
            --config configs/benchmarks/tofu-llama32-1b-forget10.yaml \
            --output results/tofu-openunlearning-phase-release-smoke.json

          FROZEN=results/releases/tofu-llama32-1b-forget10-2026-08-11/frozen-hashes.json
          readarray -t HASHES < <(python - "$FROZEN" <<'PY'
          import json, sys
          f = json.load(open(sys.argv[1]))
          for key in [
              'plan_sha256',
              'forget_ids_sha256',
              'original_model_sha256',
              'original_optimizer_sha256',
              'deletion_model_sha256',
              'deletion_optimizer_sha256',
          ]:
              print(f[key])
          PY
          )

          timeout --signal=TERM --kill-after=180s "${MAX_RUNTIME_MINUTES}m" \
            python scripts/reconstruct_tofu_for_openunlearning.py \
              --expected-plan-sha256 "${HASHES[0]}" \
              --expected-forget-sha256 "${HASHES[1]}" \
              --expected-original-model-sha256 "${HASHES[2]}" \
              --expected-original-optimizer-sha256 "${HASHES[3]}" \
              --expected-deletion-model-sha256 "${HASHES[4]}" \
              --expected-deletion-optimizer-sha256 "${HASHES[5]}"

          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path('results/releases/tofu-llama32-1b-forget10-2026-08-11/frozen-hashes.json').read_text())
          rebuilt = json.loads(Path('runs/tofu-openunlearning-reconstruction/summary.json').read_text())
          assert rebuilt['status'] == 'passed'
          assert rebuilt['original']['model_sha256'] == frozen['original_model_sha256']
          assert rebuilt['original']['optimizer_sha256'] == frozen['original_optimizer_sha256']
          assert rebuilt['deletion']['model_sha256'] == frozen['deletion_model_sha256']
          assert rebuilt['deletion']['optimizer_sha256'] == frozen['deletion_optimizer_sha256']
          print('Canonical state hash gate passed; standardized evaluation may proceed', flush=True)
          PY

          # Install the pinned external evaluator only after exact reconstruction succeeds.
          # Evaluation uses eager attention uniformly, avoiding the upstream optional
          # FlashAttention2 dependency while leaving OpenUnlearning metric code/config pinned.
          python -m pip install --no-cache-dir -e external/open-unlearning
          test "$(git -C external/open-unlearning rev-parse HEAD)" = "4ad738aaf60f6a4385f6e2506d01da99e76c31f3"

          python scripts/openunlearning_adapter.py tofu-eval \
            --checkpoint runs/tofu-openunlearning-reconstruction/hf/original \
            --forget-split forget10 \
            --task-name uas_frozen_original_forget10 \
            --attention-implementation eager \
            --output-root results/openunlearning/tofu

          python scripts/openunlearning_adapter.py tofu-eval \
            --checkpoint runs/tofu-openunlearning-reconstruction/hf/deletion \
            --forget-split forget10 \
            --task-name uas_frozen_trace_delete_forget10 \
            --attention-implementation eager \
            --output-root results/openunlearning/tofu

          test -f results/openunlearning/tofu/reference/retain90/TOFU_EVAL.json
          test -f results/openunlearning/tofu/models/uas_frozen_original_forget10/TOFU_EVAL.json
          test -f results/openunlearning/tofu/models/uas_frozen_trace_delete_forget10/TOFU_EVAL.json
          test -f results/openunlearning/tofu/models/uas_frozen_original_forget10/uas_interop.json
          test -f results/openunlearning/tofu/models/uas_frozen_trace_delete_forget10/uas_interop.json
          REMOTE

      - name: Collect compact reconstruction and evaluation evidence
        if: always() && steps.pod.outputs.pod_id != ''
        continue-on-error: true
        run: |
          mkdir -p gpu-artifacts
          cp runpod-allocation.json gpu-artifacts/
          for file in tofu-openunlearning-evidence.tar.gz tofu-openunlearning-evidence.sha256; do
            scp \
              -i .runpod/id_ed25519 \
              -P "${{ steps.pod.outputs.port }}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=2 \
              "root@${{ steps.pod.outputs.host }}:/workspace/unlearning/results/$file" \
              "gpu-artifacts/$file" || true
          done

      - name: Terminate RunPod Pod
        if: always() && steps.pod.outputs.pod_id != ''
        run: |
          python scripts/runpod_control.py delete --pod-id "${{ steps.pod.outputs.pod_id }}"

      - name: Record bounded cost estimate
        if: always() && steps.pod.outputs.pod_id != ''
        run: |
          mkdir -p gpu-artifacts
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          allocation = json.loads(Path('runpod-allocation.json').read_text())
          elapsed = max(0, time.time() - int("${{ steps.pod.outputs.allocated_epoch }}"))
          hourly = float(allocation['cost_per_hr'])
          payload = {
              'elapsed_seconds_until_cleanup': elapsed,
              'reported_hourly_gpu_cost': hourly,
              'estimated_gpu_cost_until_cleanup': hourly * elapsed / 3600.0,
              'hard_hourly_cap': float(os.environ['MAX_HOURLY_COST']),
              'hard_remote_runtime_minutes': int(os.environ['MAX_RUNTIME_MINUTES']),
              'training_passes': 2,
              'benchmark': 'OpenUnlearning TOFU forget10',
              'attention_implementation': 'eager',
          }
          Path('gpu-artifacts/cost-estimate.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload OpenUnlearning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-openunlearning-evidence
          path: gpu-artifacts
          if-no-files-found: warn
          retention-days: 60
          compression-level: 0

      - name: Enforce evaluation success
        if: always()
        run: |
          if [[ "${{ steps.remote.outcome }}" != "success" ]]; then
            echo "The remote TOFU reconstruction/OpenUnlearning evaluation did not complete successfully." >&2
            exit 1
          fi
          test -f gpu-artifacts/tofu-openunlearning-evidence.tar.gz
          test -f gpu-artifacts/tofu-openunlearning-evidence.sha256
