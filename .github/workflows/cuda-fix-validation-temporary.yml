name: Temporary CUDA fix validation

on:
  push:
    branches: [fix-cuda-batch-device]
    paths:
      - gpu/trigger-cuda-fix-validation-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cuda-batch-device
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m unlearning_at_scale.cli core-smoke --output runs/cuda-fix-validation
      - name: Persist success marker
        run: |
          printf 'CPU regression suite and core replay smoke passed for CUDA device fix.\n' > gpu/cuda-fix-validation-passed-v1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/cuda-fix-validation-passed-v1
          git commit -m 'Record successful CUDA fix validation'
          git push origin HEAD:fix-cuda-batch-device
