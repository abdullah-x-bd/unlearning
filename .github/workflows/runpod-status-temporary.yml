name: Temporary RunPod status probe

on:
  push:
    branches: [main]
    paths:
      - gpu/trigger-runpod-status-v1

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read current research Pod status and utilization
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          rest_req = urllib.request.Request(
              'https://rest.runpod.io/v1/pods',
              headers={'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}"},
          )
          with urllib.request.urlopen(rest_req, timeout=30) as response:
              pods = json.load(response)

          runtime_by_id = {}
          graph_error = None
          try:
              gql = {
                  'query': '''query { myself { pods { id name runtime { uptimeInSeconds gpus { id gpuUtilPercent memoryUtilPercent } container { cpuPercent memoryPercent } } } } }'''
              }
              gql_req = urllib.request.Request(
                  f"https://api.runpod.io/graphql?api_key={os.environ['RUNPOD_API_KEY']}",
                  data=json.dumps(gql).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(gql_req, timeout=30) as response:
                  gql_payload = json.load(response)
              if gql_payload.get('errors'):
                  graph_error = gql_payload['errors']
              runtime_by_id = {
                  p['id']: p.get('runtime')
                  for p in ((gql_payload.get('data') or {}).get('myself') or {}).get('pods', [])
              }
          except Exception as exc:
              graph_error = f"{type(exc).__name__}: {exc}"

          rows = []
          for pod in pods:
              if not str(pod.get('name', '')).startswith('uas-pythia160-'):
                  continue
              gpu = pod.get('gpu') or {}
              machine = pod.get('machine') or {}
              rows.append({
                  'id': pod.get('id'),
                  'name': pod.get('name'),
                  'desiredStatus': pod.get('desiredStatus'),
                  'adjustedCostPerHr': pod.get('adjustedCostPerHr'),
                  'costPerHr': pod.get('costPerHr'),
                  'gpu': gpu.get('displayName') or machine.get('gpuDisplayName') or machine.get('gpuTypeId'),
                  'cloudType': pod.get('cloudType'),
                  'createdAt': pod.get('createdAt'),
                  'runtime': runtime_by_id.get(pod.get('id')),
              })
          payload = {'pods': rows, 'graphql_error': graph_error}
          Path('gpu/runpod-status-v1.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
      - name: Persist sanitized status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/runpod-status-v1.json
          git commit -m 'Record current guarded RunPod status' || exit 0
          git push origin HEAD:main
