name: Temporary state hash fix validation

on:
  push:
    branches: [fix-state-hashing]
    paths:
      - gpu/trigger-state-hash-fix-validation-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-state-hashing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m unlearning_at_scale.cli core-smoke --output runs/state-hash-fix-validation
      - name: Persist success marker
        run: |
          printf 'Regression suite and core replay smoke passed for scalar optimizer-state hashing fix.\n' > gpu/state-hash-fix-validation-passed-v1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpu/state-hash-fix-validation-passed-v1
          git commit -m 'Record successful state hash fix validation'
          git push origin HEAD:fix-state-hashing
