seed: 2026
strict_determinism: true
materialize_redacted_store: true
release_mode: true
output_dir: runs/tofu-llama32-1b-trace
model:
  name: meta-llama/Llama-3.2-1B-Instruct
  artifact_key: llama32_1b_instruct
  revision: main
  device: cuda
  dtype: bf16
  attention_implementation: eager
  disable_dropout: false
data:
  train_dir: data/prepared/tofu-llama32-1b-openunlearning
plan:
  microbatch_size: 8
  grad_accum_steps: 4
  epochs: 5
  shuffle: true
  shuffle_seed: 0
  rng_seed: 2027
optimizer:
  lr: 0.0000001
  weight_decay: 0.01
  warmup_ratio: 0.20
  schedule: cosine
checkpoint_every: 25
replay_policies: [slot_mask, filter]
run_repacked_baseline: true
forget_scenarios:
  - {name: tofu-forget01, strategy: id_file, path: data/prepared/tofu-llama32-1b-openunlearning/forget01_ids.txt}
  - {name: tofu-forget05, strategy: id_file, path: data/prepared/tofu-llama32-1b-openunlearning/forget05_ids.txt}
  - {name: tofu-forget10, strategy: id_file, path: data/prepared/tofu-llama32-1b-openunlearning/forget10_ids.txt}
