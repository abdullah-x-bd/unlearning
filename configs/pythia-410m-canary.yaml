seed: 2026
strict_determinism: true
materialize_redacted_store: true
output_dir: runs/pythia-410m-canary
model:
  name: EleutherAI/pythia-410m
  revision: main
  device: cuda
  dtype: bf16
  attention_implementation: eager
  disable_dropout: false
data:
  train_dir: data/prepared/wikitext103-pythia-256
plan:
  microbatch_size: 4
  grad_accum_steps: 4
  epochs: 1
  shuffle: true
  shuffle_seed: 2026
  rng_seed: 2027
optimizer:
  lr: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.05
  schedule: cosine
  foreach: false
  fused: false
checkpoint_every: 250
replay_policies: [slot_mask, filter]
run_repacked_baseline: true
forget_scenarios:
  - name: canary-group-0
    strategy: canary_group
    groups: [0]
    content_closure: true
