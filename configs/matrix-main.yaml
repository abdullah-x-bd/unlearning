output_root: runs/main-matrix

base:
  seed: 2026
  strict_determinism: true
  materialize_redacted_store: true
  release_mode: true
  model:
    device: cuda
    dtype: bf16
    attention_implementation: eager
    disable_dropout: false
  data:
    train_dir: data/prepared/wikitext103-pythia-256
  plan:
    microbatch_size: 4
    grad_accum_steps: 4
    epochs: 1
    shuffle: true
    shuffle_seed: 2026
    rng_seed: 2027
  optimizer:
    lr: 0.00001
    weight_decay: 0.01
    warmup_ratio: 0.05
    schedule: cosine
  checkpoint_every: 500
  replay_policies: [slot_mask, filter]
  run_repacked_baseline: true
  forget_scenarios:
    - {name: late-1pct, strategy: late, fraction: 0.01}

models:
  - {name: EleutherAI/pythia-160m, artifact_key: pythia_160m, revision: step143000}
  - {name: EleutherAI/pythia-410m, artifact_key: pythia_410m, revision: step143000}
  - {name: EleutherAI/pythia-1b, artifact_key: pythia_1b, revision: step143000}
  - {name: EleutherAI/pythia-1.4b, artifact_key: pythia_1_4b, revision: step143000}
  - {name: EleutherAI/pythia-2.8b, artifact_key: pythia_2_8b, revision: step143000}
